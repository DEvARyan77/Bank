spring.application.name=minibank

# Database (override with environment variables DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/minibank}
spring.datasource.username=${DB_USERNAME:minibank}
spring.datasource.password=${DB_PASSWORD:minibank}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Frontend origins allowed to call the API (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# API docs
springdoc.swagger-ui.path=/swagger-ui.html
